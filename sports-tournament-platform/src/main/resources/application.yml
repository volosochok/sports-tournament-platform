spring:
  application:
    name: sports-tournament-platform

  # PostgreSQL configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/sports_tournament_db
    username: postgres
    password: 60026082
    driver-class-name: org.postgresql.Driver

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: create-drop  # create-drop for dev, update for prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Jackson configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# Server configuration
server:
  port: 8080
  error:
    include-stacktrace: never  # не показувати stacktrace клієнту
    include-message: always

# Logging
logging:
  level:
    com.sportstournament: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE